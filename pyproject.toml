[project]
name = "hermes-omo-plugin"
version = "0.1.0"
description = "Native OMO multi-agent orchestration for Hermes Agent"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
