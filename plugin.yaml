name: omo
version: 0.1.0
description: >-
  Native OMO (Oh My OpenAgent) multi-agent orchestration for Hermes Agent —
  the ported agent fleet (Sisyphus, Hephaestus, Prometheus, Atlas, Metis,
  Momus, Oracle, Librarian, Explore, Multimodal-Looker, Sisyphus-Junior)
  driven through Hermes' own subagent lifecycle, plus an approval transport
  that forwards worker approvals to the session.
author: jomakori
provides_tools:
  - omo
  - omo_task
provides_hooks:
  - pre_tool_call
  - pre_approval_request
  - subagent_start
  - subagent_stop
provides_commands:
  - omo
  - omo-approve
  - omo-approvals
provides_approval_transports:
  - omo
kind: agent
capabilities:
  - subagents
  - tools
  - approval_transport
