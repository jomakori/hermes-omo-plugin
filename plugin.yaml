name: omo
version: 0.3.1
description: >-
  Native OMO (Oh My OpenAgent) multi-agent orchestration for Hermes Agent —
  the ported agent fleet (Sisyphus, Hephaestus, Prometheus, Atlas, Metis,
  Momus, Oracle, Librarian, Explore, Multimodal-Looker, Sisyphus-Junior)
  driven through Hermes' own subagent lifecycle. Replaces the OpenCode
  delegation layer entirely.
author: jomakori
provides_tools:
  - omo
  - omo_task
  - jev_ask
kind: standalone
